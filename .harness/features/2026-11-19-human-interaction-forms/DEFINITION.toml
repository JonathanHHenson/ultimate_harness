[[requirements]]
id = "FLOW"
kind = "functional"
description = "Provide one-page and adaptive multi-page feedback. Return submitted responses to the agent, show waiting and final confirmation states, and stop the server."
definition_of_done = "Exercise both lifecycles end to end through the CLI and browser, including explicit multi-page close and retained responses."
status = "DONE"
blocked_reason = ""
blocked_from = ""

